apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-monitor-frontend-productcatalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anomaly-monitor-frontend-productcatalog
  template:
    metadata:
      labels:
        app: anomaly-monitor-frontend-productcatalog
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: anomaly-monitor
        image: index.docker.io/oadewusi/anomaly-monitor:v4
        imagePullPolicy: Always
        command: ["python"]
        args:
          [
            "anomaly-monitor.py",
            "-f", "frontend",
            "-t", "productcatalogservice",
            "-d", "/app/training/frontend_productcatalog.json",
            "-p", "8002",
            "--prefix", "lab7_frontend_2_productcatalog"
          ]
        ports:
        - containerPort: 8002
        resources:
          requests:
            cpu: 200m
