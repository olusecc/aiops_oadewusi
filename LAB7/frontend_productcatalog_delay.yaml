apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: productcatalogservice
spec:
  hosts:
  - productcatalogservice
  http:
  - match:
    - sourceLabels:
        app: "frontend"
    fault:
      delay:
        fixedDelay: .2s
        percent: 100
    route:
    - destination:
        host: productcatalogservice
  - route:
    - destination:
        host: productcatalogservice
  
