services:
  app:
    image: oadewusi/getting-started
 
    ports:
      - 3000:3000
    working_dir: /app
   
    # environment:
    #   MYSQL_HOST: mysql
    #   MYSQL_USER: root
    #   MYSQL_PASSWORD: secret
    #   MYSQL_DB: todos
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    volumes:
      - todo-mysql-data:/var/lib/mysql
    environment: 
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: todos
    hostname: mysql
    networks:
      - app-network

volumes:
  todo-mysql-data:
networks:
  app-network:
    driver: bridge